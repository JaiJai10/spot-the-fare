<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Fare · København</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#0b0f17; --surface:#131a26; --surface2:#1a2332; --border:#243147;
    --text:#e8edf5; --muted:#8fa0b8; --faint:#5b6f8d;
    --yellow:#ffc62b; --hot:#ff5c5c; --orange:#ff9f43; --amber:#ffc62b;
    --blue:#58b7ff; --green:#3ddc84;
    --bg-glow:#101a2c; --appbg:rgba(11,15,23,.6); --mapbg:#0d2745;
  }
  :root[data-theme="light"]{
    --bg:#eef1f6; --surface:#ffffff; --surface2:#e7ecf4; --border:#ccd6e3;
    --text:#15202e; --muted:#4d5e77; --faint:#75849b;
    --yellow:#c98f00; --hot:#d62b2b; --orange:#de6d14; --amber:#b57f00;
    --blue:#1668d4; --green:#0d9d55;
    --bg-glow:#dfe6f2; --appbg:rgba(255,255,255,.72); --mapbg:#d9e4f0;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45;
  }
  .app{max-width:540px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
       border-left:1px solid var(--border); border-right:1px solid var(--border); background:var(--appbg);}
  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:9px; padding:14px 14px 10px;}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--yellow),#f59f00);
        display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 2px 10px rgba(255,198,43,.25);}
  .brand b{display:block;font-size:16.5px;letter-spacing:.2px;white-space:nowrap;}
  .brand small{color:var(--muted);font-size:12px;white-space:nowrap;}
  .spacer{flex:1;}
  .lang{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:2px;flex:0 0 auto;}
  .lang button{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:13px;cursor:pointer;font-family:inherit;}
  .lang button.on{background:var(--yellow);color:#1a1200;}
  .clock{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
         padding:5px 9px;border-radius:18px;font-variant-numeric:tabular-nums;font-size:13px;flex:0 0 auto;}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);
        display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
  .bell svg{width:17px;height:17px;}
  #refreshBtn{border:1px solid var(--border);font-family:inherit;color:var(--muted);}
  #themeBtn{font-size:17px;line-height:1;}
  .bell .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--hot);
        color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  /* ---------- tabs ---------- */
  nav{display:flex;margin:4px 16px 0;gap:4px;background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:4px;}
  nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border:0;border-radius:10px;
      background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  nav button svg{width:16px;height:16px;}
  nav button.on{background:linear-gradient(135deg,rgba(255,198,43,.18),rgba(255,159,67,.10));color:var(--yellow);}
  main{flex:1;overflow-y:auto;padding:14px 16px 110px;}
  /* ---------- chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:6px 13px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);
        color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .chip.on{background:var(--yellow);color:#1a1200;border-color:var(--yellow);}
  #sortChip.on{background:var(--surface2);color:var(--blue);border-color:rgba(88,183,255,.5);}
  .dayseg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
          padding:4px;margin:0 0 10px;overflow-x:auto;max-width:100%;}
  .wcell{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;
         color:var(--muted);font-size:10.5px;font-weight:700;padding:4px 11px;border-radius:10px;cursor:pointer;
         font-family:inherit;min-width:46px;flex:1;}
  .wcell .wd{font-size:10px;text-transform:uppercase;letter-spacing:.4px;}
  .wcell .ws{font-size:13.5px;font-weight:800;color:var(--faint);}
  .wcell.on{background:var(--yellow);color:#1a1200;}
  .wcell.on .ws{color:#1a1200;}
  .wcell.hot .ws{color:var(--hot);}
  .wcell.on.hot .ws{color:#1a1200;}
  .fab{position:fixed;right:20px;bottom:90px;width:54px;height:54px;border-radius:50%;
       background:linear-gradient(135deg,var(--yellow),#f59f00);color:#1a1200;font-size:26px;font-weight:800;
       border:0;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;z-index:35;
       display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .frm label{display:block;font-size:11px;color:var(--faint);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.8px;}
  .frm input,.frm select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
        background:var(--surface2);color:var(--text);font-size:14px;font-family:inherit;}
  .frm .row2{display:flex;gap:8px;} .frm .row2 > div{flex:1;min-width:0;}
  /* ---------- cards ---------- */
  .card{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;border-radius:16px;
        background:var(--surface);border:1px solid var(--border);cursor:pointer;text-align:left;color:var(--text);
        font-family:inherit;transition:border-color .15s, transform .05s;}
  .card:active{transform:scale(.985);}
  .card.live{border-color:rgba(255,92,92,.55);box-shadow:0 0 0 1px rgba(255,92,92,.15), 0 6px 24px rgba(255,92,92,.08);}
  .ring{flex:0 0 auto;position:relative;width:52px;height:52px;}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .ring svg{transform:rotate(-90deg);}
  .cbody{flex:1;min-width:0;}
  .t1{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;}
  .t1 .ic{font-size:15px;}
  .t2{color:var(--muted);font-size:12.5px;margin-top:1px;}
  .t3{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums;}
  .stat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;flex:0 0 auto;}
  .stat.live{background:rgba(255,92,92,.15);color:var(--hot);}
  .stat.on{background:rgba(255,159,67,.15);color:var(--orange);}
  .stat.next{background:rgba(255,198,43,.14);color:var(--amber);}
  .stat.late{background:var(--surface2);color:var(--faint);border:1px solid var(--border);}
  .stat.done{background:var(--surface2);color:var(--faint);border:1px solid var(--border);}
  .spotline{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;color:var(--blue);}
  .arrow{color:var(--faint);font-size:16px;}
  /* ---------- upcoming ---------- */
  .up-head{font-size:11.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--faint);margin:20px 2px 9px;}
  .up-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);
          border-radius:12px;margin-bottom:6px;cursor:pointer;font-family:inherit;color:var(--text);text-align:left;width:100%;}
  .up-row:active{transform:scale(.985);}
  .up-date{flex:0 0 auto;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:4px 8px;
           font-size:11px;color:var(--amber);font-weight:700;text-align:center;line-height:1.25;}
  .up-name{font-size:13px;font-weight:600;}
  .up-ven{color:var(--muted);font-size:11.5px;}
  .up-time{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* ---------- map ---------- */
  .mapcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
  .maphead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
  .maphead b{font-size:14px;}
  .maphead span{color:var(--faint);font-size:12px;}
  .mapwrap{height:min(78vh,780px);overflow:auto;background:var(--mapbg);}
  svg.map{display:block;width:100%;height:auto;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;}
  .mk{cursor:pointer;}
  .mk .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.7);opacity:.55}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
  /* ---------- planner ---------- */
  .plan-intro{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .leg{display:flex;gap:12px;position:relative;}
  .leg .rail{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;}
  .leg .dot{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:2px solid var(--yellow);
            display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1;}
  .leg .line{flex:1;width:2px;background:linear-gradient(var(--border),var(--surface2));margin:2px 0;}
  .leg .body{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:0;}
  .drive{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:11.5px;padding:6px 0 6px 46px;}
  .drive svg{width:13px;height:13px;flex:0 0 auto;}
  .drive b{color:var(--muted);}
  .leg .row1{display:flex;justify-content:space-between;align-items:center;}
  .leg .row1 b{font-size:14px;}
  .leg .earn{font-size:13px;font-weight:800;color:var(--green);white-space:nowrap;}
  .leg .row2{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .leg .row3{margin-top:7px;font-size:12px;color:var(--blue);}
  .summ{margin-top:16px;background:linear-gradient(135deg,rgba(255,198,43,.12),rgba(255,159,67,.06));
        border:1px solid rgba(255,198,43,.35);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .summ b{font-size:19px;color:var(--yellow);}
  .summ small{color:var(--muted);font-size:12px;display:block;}
  .planbar{display:flex;gap:8px;margin-bottom:12px;}
  .btn{width:100%;margin-top:14px;padding:13px;border-radius:14px;border:0;cursor:pointer;font-family:inherit;
       font-size:14.5px;font-weight:700;background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn.small{width:auto;margin-top:0;padding:9px 14px;font-size:13px;border-radius:12px;}
  .btn.yellow{background:linear-gradient(135deg,var(--yellow),#f59f00);color:#1a1200;border:0;}
  .leg.now .body{border-color:rgba(255,92,92,.6);box-shadow:0 0 0 1px rgba(255,92,92,.18);}
  .leg .skip{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);
        color:var(--green);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;align-self:center;}
  .leg .skip:hover{background:rgba(61,220,132,.15);border-color:var(--green);}
  .leg .earn small{display:block;font-size:10px;color:var(--faint);font-weight:600;text-align:right;}
  .leaveby{margin-top:6px;font-size:12px;font-weight:700;color:var(--blue);}
  .leaveby.warn{color:var(--hot);}
  .posline{margin-top:6px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:5px;}
  /* ---------- sheet ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(4,7,12,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  #sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:540px;background:var(--surface);
         border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;z-index:50;transition:transform .3s cubic-bezier(.2,.9,.25,1);
         max-height:88vh;overflow-y:auto;box-shadow:0 -10px 50px rgba(0,0,0,.5);}
  #sheet.open{transform:translate(-50%,0);}
  .sheet-in{padding:16px 18px 26px;}
  .grab{width:44px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 0;}
  .s-top{display:flex;align-items:flex-start;gap:12px;margin-top:10px;}
  .s-top .ring{width:64px;height:64px;}
  .s-top .ring .num{font-size:17px;}
  .s-title{font-size:17.5px;font-weight:800;}
  .s-ven{color:var(--muted);font-size:13px;margin-top:2px;}
  .s-time{color:var(--faint);font-size:12.5px;margin-top:4px;}
  .sect{margin-top:18px;}
  .sect h4{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);margin-bottom:9px;}
  .curve{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px 12px 6px;}
  .curve svg{width:100%;height:auto;display:block;}
  .curve-note{font-size:11.5px;color:var(--faint);margin-top:6px;}
  .spotrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border);border-radius:13px;margin-bottom:8px;background:var(--surface2);}
  .spotrow.best{border-color:rgba(255,198,43,.5);background:linear-gradient(135deg,rgba(255,198,43,.08),rgba(255,198,43,.02));}
  .spotrow .pin{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
  .spotrow b{font-size:13.5px;display:block;}
  .spotrow small{color:var(--muted);font-size:11.5px;}
  .spotrow .r{flex:1;text-align:right;white-space:nowrap;}
  .spotrow .r b{color:var(--green);font-size:12.5px;}
  .besttag{font-size:10px;font-weight:800;color:#1a1200;background:var(--yellow);padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:1px;}
  .boosters{display:flex;flex-wrap:wrap;gap:8px;}
  .bo{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 11px;font-size:12px;}
  .bo b{color:var(--amber);}
  .bo i{font-style:normal;color:var(--muted);}
  .checkin{display:flex;gap:8px;}
  .checkin button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);
        color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .checkin button.hot:hover{background:rgba(255,92,92,.2);border-color:var(--hot);}
  .checkin button.ok:hover{background:rgba(61,220,132,.15);border-color:var(--green);}
  .checkin button.dead:hover{background:rgba(143,160,184,.15);border-color:var(--muted);}
  /* ---------- alerts panel ---------- */
  #alerts{position:absolute;top:62px;right:14px;left:14px;max-width:520px;margin:0 auto;background:var(--surface);border:1px solid var(--border);
          border-radius:16px;z-index:60;display:none;box-shadow:0 18px 50px rgba(0,0,0,.55);}
  #alerts.show{display:block;}
  #alerts .al{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px;font-size:13px;}
  #alerts .al:last-child{border-bottom:0;}
  #alerts .al .ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);
        display:flex;align-items:center;justify-content:center;font-size:14px;}
  #alerts .al small{color:var(--faint);display:block;margin-top:2px;}
  #alerts .head{padding:12px 14px;font-weight:700;font-size:13.5px;border-bottom:1px solid var(--border);
        display:flex;justify-content:space-between;align-items:center;}
  #alerts .head button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;}
  /* ---------- toast ---------- */
  #toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(16px);background:#e9f3ff;color:#0b1626;
         font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;
         transition:all .25s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .demo-note{color:var(--faint);font-size:11px;text-align:center;padding:18px 10px 6px;}
  .demo-note b{color:var(--muted);}
  footer{color:var(--faint);font-size:11px;text-align:center;padding:4px 16px 18px;}
  /* ---------- kort (Leaflet) ---------- */
  .layers{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border);}
  .lyr{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:14px;border:1px solid var(--border);
       background:var(--surface2);color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .lyr.on{background:rgba(255,198,43,.14);border-color:rgba(255,198,43,.45);color:var(--yellow);}
  .lmeta{width:18px;height:18px;border-radius:50%;background:#58b7ff;color:#0b1626;font-size:10px;font-weight:800;
         display:flex;align-items:center;justify-content:center;border:2px solid #fff;
         box-shadow:0 1px 5px rgba(0,0,0,.55);}
  .ltaxi{width:22px;height:22px;border-radius:50%;background:#111a29;border:2px solid #ffc62b;
         display:flex;align-items:center;justify-content:center;font-size:11px;
         box-shadow:0 1px 5px rgba(0,0,0,.55);}
  .leaflet-container{background:var(--mapbg);font-family:inherit;}
  .leaflet-control-zoom a{background:var(--surface);color:var(--text);border:1px solid var(--border);}
  .leaflet-control-zoom a:hover{background:var(--surface2);color:var(--yellow);}
  .leaflet-control-attribution{background:var(--surface);color:var(--faint);font-size:9px;}
  .leaflet-control-attribution a{color:var(--muted);}
  .lmk{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}
  .lmk-emoji{position:relative;z-index:2;font-size:17px;background:#111a29;border:2px solid var(--c,#ffc62b);
    border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.55);}
  .lmk-pulse{position:absolute;inset:0;border-radius:50%;background:var(--c,#ffc62b);opacity:.45;animation:lmpulse 2.2s ease-out infinite;}
  @keyframes lmpulse{0%{transform:scale(.6);opacity:.5}70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
  .lmk-dim{width:12px;height:12px;border-radius:50%;background:#33415c;border:2px solid #243147;}
  .lmk-tip{background:var(--surface) !important;border:1px solid var(--border);color:var(--text) !important;font-size:12px;
    border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.35);}
  .lmk-tip::before{display:none;}
  body.osm-dark .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.35);}
  .mapwrap{position:relative;}
  @media(min-width:900px){
    .app{max-width:1120px;flex-direction:row;align-items:stretch;}
    .left{flex:1;border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;}
    .right{flex:1.15;display:flex;flex-direction:column;}
    main{max-height:calc(100vh - 74px);}
    .right .mapcard{flex:1;display:flex;flex-direction:column;margin:14px 16px;border-radius:18px;}
    .right .mapwrap{flex:1;height:auto;}
    #sheet{max-width:560px;}
  }
  @media(max-width:420px){
    .brand small{display:none;}
    .clock{padding:5px 7px;}
    .t1{font-size:13.5px;}
  }
</style>

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fmt = n => lang==="da" ? n.toLocaleString("da-DK") : n.toLocaleString("en-GB");
const kr = n => lang==="da" ? `~${fmt(n)} kr` : `~DKK ${fmt(n)}`;
const scoreColor = s => s>=85 ? "#ff5c5c" : s>=75 ? "#ff9f43" : s>=65 ? "#ffc62b" : "#5b7a9d";
const toM = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
function nowClock(){
  try{
    const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Copenhagen",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    return (p.find(x=>x.type==="hour").value)+":"+(p.find(x=>x.type==="minute").value);
  }catch(e){
    const d = new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
}
function nowMin(){
  const c = nowClock().split(":");
  return (+c[0])*60 + (+c[1]);
}
function todayStr(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Copenhagen"}).format(new Date());
}
function dataToday(){ return LIVE ? LIVE.dato : todayStr(); }
function addDaysStr(iso, n){
  const d = new Date(iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10));
  d.setDate(d.getDate()+n);
  return isoDate(d);
}
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function status(e){
  if(LIVE && e.dato){
    if(e.dato < dataToday()) return {k:"done", t:L.statDone};
    if(e.dato > dataToday()) return {k:"late", t:e.dato===addDaysStr(dataToday(),1) ? L.statTomorrow : L.statLate};
  }
  const startM = toM(e.start), endM = toM(e.end) + (toM(e.end)<startM ? 1440 : 0);
  const n = nowMin();
  if(n>=startM && n<endM) return {k:"on", t:L.statOn};
  if(n>=endM && n<=endM+90) return {k:"live", t:L.statLive};
  if(n>=endM-120 && n<endM) return {k:"next", t:L.statNext};
  if(n > endM+90) return {k:"done", t:L.statDone};  // overstået i dag → nederst i listen
  return {k:"late", t:L.statLate};
}
function tickClock(){
  $("clock").textContent = nowClock();
  $("mapSub").textContent = fmtDate(LIVE ? LIVE.dato : todayStr()) + " · " + nowClock();
}
function ring(s, size, lw){
  const r = (size-lw)/2, C = 2*Math.PI*r, off = C*(1-s/100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="${lw}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${scoreColor(s)}" stroke-width="${lw}" stroke-linecap="round"
    stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s"/></svg>`;
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400); }

/* ============ TONIGHT LIST ============ */
let curFilter = "all";
let curDay = 0;      // 0 = i dag, 1 = i morgen
let curSort = "time"; // "score" eller "time" — tidligst først som standard
function renderList(){
  renderWeek();
  const el = $("list"); el.innerHTML = "";
  const prio = {live:0, on:1, next:2, late:3};
  const dayStr = addDaysStr(dataToday(), curDay);
  let list = EVENTS.filter(e => (curFilter==="all"||e.cat===curFilter) && (!LIVE || e.dato===dayStr));
  list.sort((a,b)=>{
    if(curSort==="time"){
      // tidligst først — overståede events til sidst
      const da = status(a).k==="done" ? 1 : 0, db = status(b).k==="done" ? 1 : 0;
      if(da!==db) return da-db;
      return (a.start+a.end).localeCompare(b.start+b.end) || (b.score-a.score);
    }
    const pa = prio[status(a).k] ?? 9, pb = prio[status(b).k] ?? 9;
    if(pa!==pb) return pa-pb;
    return (b.score-a.score) || (a.start+a.end).localeCompare(b.start+b.end);
  });
  if(!list.length){ el.innerHTML = `<div style="color:var(--faint);text-align:center;padding:30px 0">${L.noEventsCat}</div>`; }
  list.forEach(e=>{
    const st = status(e);
    el.insertAdjacentHTML("beforeend", `
    <button class="card ${st.k==="live"?"live":""}" data-id="${e.id}">
      <div class="ring">${ring(e.score,52,4)}<div class="num" style="color:${scoreColor(e.score)}">${e.score}</div></div>
      <div class="cbody">
        <div class="t1"><span class="ic">${e.icon}</span>${esc(tr(e.name))}${e.my?` <span class="stat next">${L.myTag}</span>`:""} <span class="stat ${st.k}">${st.t}</span></div>
        <div class="t2">${esc(tr(e.venue))}${e.cap?` · ${L.cap} ${e.cap}`:""}</div>
        <div class="t3"><span>${e.start}–${e.end}</span><span>·</span><span>${L.letout} ${e.window}</span></div>
        <div class="spotline">📍 ${esc(tr(e.spot))} <span style="color:var(--faint)">· ${L.wait} ${e.wait}</span></div>
      </div>
      <div class="arrow">›</div>
    </button>`);
  });
  el.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openSheet(c.dataset.id)));
}

const Lf = window.L;

function tileLayerFor(theme){
  if(theme==="light") return Lf.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
  return Lf.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
}
function tileLayerOSM(){
  return Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
}
function setTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem("stf_theme", t); }catch(e){}
  if($("themeBtn")) $("themeBtn").textContent = t==="light" ? "☀️" : "🌙";
  document.body.classList.toggle("osm-dark", t==="dark");
  if(MAP && TILE){
    try{ MAP.removeLayer(TILE); }catch(e){}
    TILE = tileLayerFor(t).addTo(MAP);
  }
}
function initMap(){
  if(!$("leafmap")) return;
  if(!Lf){ $("leafmap").style.display="none"; $("mapFallback").style.display="block"; return; }
  try{
    if(MAP){ MAP.invalidateSize(); renderMarkers(); return; }
    MAP = Lf.map("leafmap", {scrollWheelZoom:true, zoomControl:true}).setView([55.676,12.566], 12);
    TILE = tileLayerFor(document.documentElement.dataset.theme||"light").addTo(MAP);
    TILE.on("tileerror", ()=>{
      if(TILE._fb) return; TILE._fb = true;
      try{ MAP.removeLayer(TILE); }catch(e){}
      TILE = tileLayerOSM().addTo(MAP);
      document.body.classList.add("osm-dark");
    });
    renderMarkers();
    renderBaseLayers();
    setTimeout(()=>{ try{ MAP.invalidateSize(); }catch(e){} }, 80);
  }catch(e){
    console.warn("kort fejl:", e);
    $("leafmap").style.display="none"; $("mapFallback").style.display="block";
  }
}
function renderMarkers(){
  if(!MAP) return;
  try{
    if(MARKERS) MAP.removeLayer(MARKERS);
    MARKERS = Lf.layerGroup().addTo(MAP);
    const pts = [];
    const list = LIVE
      ? EVENTS.filter(e=>e.dato===LIVE.dato && e.lat!=null && e.lon!=null)
      : EVENTS.filter(e=>EVMAP[e.id]).map(e=>{ const v=VENUES.find(x=>x.id===EVMAP[e.id]); return v? Object.assign({},e,{lat:v.lat,lon:v.lon}) : null; }).filter(Boolean);
    const seenVenues = new Set();
    list.forEach(e=>{
      const c = scoreColor(e.score);
      const icon = Lf.divIcon({className:"", html:
        `<div class="lmk" style="--c:${c}"><span class="lmk-emoji">${e.icon}</span><span class="lmk-pulse"></span></div>`,
        iconSize:[38,38], iconAnchor:[19,19]});
      const m = Lf.marker([e.lat, e.lon], {icon});
      m.bindTooltip(`${e.icon} ${esc(tr(e.name)||"")} · ${e.score}/100`, {direction:"top", offset:[0,-14], className:"lmk-tip"});
      m.on("click", ()=>openSheet(e.id));
      m.addTo(MARKERS);
      pts.push([e.lat, e.lon]);
      if(e.vid) seenVenues.add(e.vid);
    });
    if(LIVE){
      VENUES.filter(v=>!seenVenues.has(v.id)).forEach(v=>{
        const m = Lf.marker([v.lat, v.lon], {icon: Lf.divIcon({className:"", html:'<div class="lmk-dim"></div>', iconSize:[14,14], iconAnchor:[7,7]})});
        m.bindTooltip(`${esc(v.navn)} — ${L.noEventMap}`, {direction:"top", offset:[0,-6], className:"lmk-tip"});
        m.on("click", ()=>toast(L.noEventMap));
        m.addTo(MARKERS);
      });
    }
    if(pts.length){
      try{ MAP.fitBounds(Lf.latLngBounds(pts), {padding:[46,46], maxZoom:13}); }catch(e){}
    }
  }catch(e){ console.warn("markør-fejl:", e); }
}

let openId = null;
function curveSVG(e){
  const cv = CURVES[e.curve], W=300, H=96, pad=8;
  const xs = i => pad + i*(W-2*pad)/6;
  const ys = v => H-pad - (v/100)*(H-2*pad-8);
  const lbl = cv.labels[lang];
  let pts = cv.v.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ");
  let area = `M${xs(0).toFixed(1)},${(H-pad-4).toFixed(1)} ` + cv.v.map((v,i)=>`L${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ") + ` L${xs(6).toFixed(1)},${(H-pad-4).toFixed(1)} Z`;
  let band = `<rect x="${xs(2)}" y="${pad}" width="${xs(4)-xs(2)}" height="${H-2*pad-8}" fill="#ffc62b" opacity="0.07"/>`;
  let labels = [0,2,4,6].map((i,k)=>`<text x="${xs(i)}" y="${H-2}" font-size="8.5" style="fill:var(--faint)" text-anchor="middle">${lbl[k]}</text>`).join("");
  let ticks = [0,2,4,6].map(i=>`<line x1="${xs(i)}" y1="${pad}" x2="${xs(i)}" y2="${H-pad-8}" style="stroke:var(--border)" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}">${band}${ticks}<path d="${area}" fill="url(#grad${e.id})"/>

/* ============ PLANNER ============ */
function hhmm2plan(mins){
  if(mins<0) mins=0;
  return String(Math.floor(mins/60)%24).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}
function renderPlanner(){
  const el = $("planner");
  if(!PLANNER.length){
    el.innerHTML = `<div style="color:var(--faint);text-align:center;padding:24px 0">${L.planEmpty}</div>
      <button class="btn" onclick="resetPlanner()">${L.planReset}</button>`;
    return;
  }
  let s = "";
  const now = nowMin();
  PLANNER.forEach((leg,i)=>{
    const drv = DRIVES[i];
    const next = PLANNER[i+1];
    const endM = leg.end ? toM(leg.end) : toM(leg.t)+150;
    const trips = leg.trips || 3;
    let leaveBy = null, tight = false;
    if(next && drv){ const tm = drv.tMin || 12; leaveBy = toM(next.t) - tm; tight = leaveBy < endM; }
    const isNow = now>=toM(leg.t) && now<=endM+90;
    s += `<div class="leg ${isNow?"now":""}">
      <div class="rail"><div class="dot">${leg.icon}</div>${next?'<div class="line"></div>':""}</div>
      <div class="body" style="margin-bottom:0">
        <div class="row1"><b>${leg.t} · ${esc(tr(leg.title))}${isNow?` <span class="stat live">${L.planNow}</span>`:""}</b>
          <span class="earn">${kr(leg.earn)}<small>≈ ${trips} ${L.planTrips}</small></span></div>
        <div class="row2">${esc(tr(leg.sub))}</div>
        <div class="row3">📍 ${esc(tr(leg.spot))} · ${L.planLeg} ${tr(leg.dur)}</div>
        ${leaveBy!==null?`<div class="leaveby ${tight?"warn":""}">⏰ ${L.planLeave} ${hhmm2plan(leaveBy)}${tight?" · ⚠️ "+L.planTight:""}</div>`:""}
        ${i===0 && MY_POS?`<div class="posline">📍 ${MY_POS_TXT}</div>`:""}
      </div>
      <button class="skip" title="${L.planSkip}" onclick="skipLeg(${i})">✓</button>
    </div>`;
    if(drv) s += `<div class="drive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14"/><path d="M5 17l4-4"/><path d="M5 17l4 4"/></svg>
      <span><b>${drv.t}</b> · ${drv.km} · ${L.planDrive} ${esc(tr(drv.from))}${i===0&&MY_POS?` · ${L.planFromYou}`:""}</span></div>`;
  });
  s += `<div class="summ">
    <div><small>${L.planTotLabel}</small><b>${kr(PLAN_TOTAL)}</b></div>
    <div style="text-align:right"><small>${tr(PLAN_TIME)}</small><b style="color:var(--text);font-size:15px">${kr(PLAN_PERH)}${L.planPerH}</b></div>
  </div>
  <button class="btn" onclick="optimizePlan()">${L.planReopt}</button>`;
  el.innerHTML = s;
}
function skipLeg(i){
  if(PLAN_SOURCE.length<=1){ PLAN_SOURCE = []; rebuildPlanner(); return; }
  PLAN_SOURCE.splice(i,1);
  rebuildPlanner();
  toast("✓ " + (lang==="da"?"Stop fjernet — planen er lagt om":"Stop removed — plan rebuilt"));
}
function resetPlanner(){
  PLAN_SOURCE = (PLAN_BASE||[]).slice(0,5);
  rebuildPlanner();
}
function optimizePlan(){
  rebuildPlanner();
  toast(L.planReoptDone);
}
function rebuildPlanner(){
  const legs = PLAN_SOURCE||[];
  if(!legs.length){ PLANNER=[]; DRIVES=[]; PLAN_TOTAL=0; PLAN_PERH=0;
    PLAN_TIME = {da:"ingen events i dag", en:"no events today"}; renderPlanner(); return; }
  let totalMin = 0;
  PLANNER = legs.map(e=>{
    const endM = toM(e.end);
    totalMin += 90; // let-out-vinduet
    return {t:hhmm2plan(endM-15), icon:e.icon, title:{da:tr(e.name),en:tr(e.name)},
      sub:{da:`${tr(e.venue)} · ${L.letout} ${e.window}`, en:`${tr(e.venue)} · ${L.letout} ${e.window}`},
      dur:{da:"ca. 1 t 30 m", en:"~1h 30m"},
      earn:earnOf(e), trips:Math.max(2, Math.round(earnOf(e)/120)),
      spot:{da:tr(e.spot),en:tr(e.spot)}, end:e.end, vid:e.vid};
  });
  DRIVES = [];
  for(let i=0;i<legs.length-1;i++){
    const a=legs[i], b=legs[i+1];
    const av=VENUES.find(v=>v.id===a.vid), bv=VENUES.find(v=>v.id===b.vid);
    if(av && bv){
      const km = distKm(av,bv);
      const tMin = Math.max(3, Math.round(km/28*60+4));
      totalMin += tMin;
      DRIVES.push({from:{da:tr(a.venue),en:tr(a.venue)}, to:{da:tr(b.venue),en:tr(b.venue)},
        t: tMin+" min", km: km.toFixed(1).replace(".",",")+" km", tMin});
    } else DRIVES.push(null);
  }
  if(MY_POS && legs.length){
    const v0 = VENUES.find(v=>v.id===legs[0].vid);
    if(v0){
      const km0 = distKm(MY_POS,v0);
      const t0 = Math.max(2, Math.round(km0/28*60+4));
      MY_POS_TXT = (lang==="da"?`${km0.toFixed(1).replace(".",",")} km · ${t0} min til ${tr(legs[0].venue)}`:
                    `${km0.toFixed(1)} km · ${t0} min to ${tr(legs[0].venue)}`);
    }
  }
  PLAN_TOTAL = legs.reduce((s,e)=>s+earnOf(e),0);
  PLAN_TRIPS = legs.reduce((s,e)=>s+Math.max(2,Math.round(earnOf(e)/120)),0)+"+";
  PLAN_TIME = wrap(`~${PLAN_TRIPS} ture · ca. ${Math.floor(totalMin/60)} t ${totalMin%60} m`);
  PLAN_PERH = Math.round(PLAN_TOTAL/Math.max(1,totalMin/60));
  renderPlanner();
}
function earnOf(e){
  let v = Math.round((e.score*7+160)/10)*10;
  if(e.type==="business"||e.type==="cruise") v = Math.round(v*1.2/10)*10;
  if(e.type==="festival") v = Math.round(v*1.05/10)*10;
  return v;
}
function useMyPos(){
  if(!navigator.geolocation){ toast(L.planPosFail); return; }
  setStatus(L.planPosBusy);
  navigator.geolocation.getCurrentPosition(pos=>{
    MY_POS = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    setStatus("");
    rebuildPlanner();
    toast(L.planPosOK);
  }, err=>{
    setStatus(L.planPosFail, true);
    setTimeout(()=>setStatus(""),4000);
  }, {timeout:10000, maximumAge:60000});
}

function parseLNDoortime(doc, vid, venuesById){
  const out=[]; const vname = venuesById[vid].navn;
  const re = /doorTimeDate\\":\\"([\dT:.Z-]+)/g; let m;
  while((m=re.exec(doc))){
    const seg = doc.slice(Math.max(0, m.index-5000), m.index);
    if(!normS(seg).includes(normS(vname))) continue;
    const names=[]; const nr=/name\\":\\"([^\\"]{2,70})/g; let nm;
    while((nm=nr.exec(seg))) names.push(nm[1]);
    if(!names.length) continue;
    let name=null;
    for(let k=names.length-1;k>=0;k--){
      const n=names[k], nn=normS(n);
      if(nn!==normS(vname) && !nn.includes("kransalen") && !nn.includes("stor sal") && !nn.includes(normS(vname))
         && n.trim().length>1 && !["ROYAL ARENA","LIVE NATION"].includes(n.trim().toUpperCase())){ name=n.trim(); break; }
    }
    if(!name) continue;
    const doors = parseISOlocal(m[1]);
    if(!doors || doors < new Date(Date.now()-86400000)) continue;
    let start = new Date(doors.getTime()+2*3600000);
    if(doors.getHours()<16) start = new Date(doors.getTime()+3600000);
    out.push(evFromStart(unesc(name), vid, start, "Live Nation", "start = døre + 2t (estimat)"));
  }
  return out;
}
function parseLNAedp(doc, vid, venuesById){

    const tm = blk.match(/information-block-times">([^<]+)</);
    if(tm){ const t = tm[1].match(/(\d{1,2}):(\d{2})\s*([AP]M)/); if(t){ const h=((+t[1])%12)+((t[3]==="PM")?12:0); start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,+t[2]); } }

}

function parseCruiseHTML(doc, dayStr){

/* Lufthavnsankomster (CPH) — best-effort: FlightRadar24 API via proxyerne.
   Returnerer ankomstbølge-events (score sættes her, overskrives ikke siden). */
const CPH_LONGHAUL = ["JFK","EWR","ORD","LAX","SFO","YYZ","PEK","PVG","HKG","SIN","BKK","DXB","DOH","AUH","IST","ICN","NRT","HND"];
async function fetchCPHArrivals(){
  const url = "https://api.flightradar24.com/common/v1/airport.json?code=CPH&plugin%5B%5D=schedule&plugin-setting%5Bschedule%5D%5Bmode%5D=arrivals&plugin-setting%5Bschedule%5D%5Blimit%5D=100";
  const txt = await proxyFetch(url, 30000);
  const d = JSON.parse(txt);
  const arr = (d.result?.response?.airport?.pluginData?.schedule?.arrivals?.data) || [];
  if(!arr.length) return [];
  const dayStr = todayStr();
  const tz = "Europe/Copenhagen";
  const buckets = new Map();
  arr.forEach(f=>{
    const t = f?.flight?.time?.scheduled?.arrival;
    if(!t) return;
    const dt = new Date(t*1000);
    const key = new Intl.DateTimeFormat("en-CA",{timeZone:tz}).format(dt);
    if(key !== dayStr) return; // kun i dag
    const iso = dt.toISOString();
    const h = +new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",hour12:false}).format(dt);
    const m = +new Intl.DateTimeFormat("en-GB",{timeZone:tz,minute:"2-digit"}).format(dt);
    const b = (m>=30? h+0.5 : h);
    if(!buckets.has(b)) buckets.set(b, []);
    buckets.get(b).push({origin:(f?.flight?.airport?.origin?.code?.iata)||""});
  });
  const out = [];
  [...buckets.entries()].sort((a,b)=>a[0]-b[0]).forEach(([b,fl])=>{
    if(fl.length<4) return;
    const h0 = Math.floor(b), m0 = (b%1)? 30 : 0;
    const start = String(h0%24).padStart(2,"0")+":"+String(m0).padStart(2,"0");
    const h1 = (h0+1)%24;
    const slut = String(h1).padStart(2,"0")+":"+String(m0).padStart(2,"0");
    const lh = fl.filter(x=>CPH_LONGHAUL.includes(x.origin)).length;
    const score = Math.min(100, 18 + fl.length*4 + (lh?4:0));
    out.push({navn:"Lufthavnen · ankomstbølge "+start, vid:"lufthavnen", type:"fly",
      dato:dayStr, start, slut, vindue:start+" – "+slut,
      kilde:"FlightRadar24", note:fl.length+" ankomster pr. 30 min"+(lh?" · langdistance":""),
      kapacitet:fl.length*130, score});
  });
  return out;
}

async function fetchWeatherBrowser(){  const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=55.6761&longitude=12.5683&hourly=temperature_2m,precipitation&timezone=Europe/Copenhagen&forecast_days=2");

async function proxyFetch(url, ms){
  let lastErr=null;
  for(const p of PROXIES){
    try{
      const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
      const r = await fetch(p+encodeURIComponent(url), {signal:c.signal, cache:"no-store"});
      clearTimeout(t);
      if(r.ok){ const txt = await r.text(); if(txt && txt.length>500) return txt; }
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error("proxy fejl: "+url);
}
function seasonAndRecurring(dayStr){

      kilde:"sæsonkalender", note:s.note||"", kapacitet:null });

function computeScoreJS(ev, venuesById, weather){
  const v = venuesById[ev.vid];
  const cap = ev.kapacitet || (v? v.kapacitet:1000);
  const mult = TYPE_MULT[ev.type]||0.7;
  const mass = 100*(1-Math.exp(-cap/9000))*mult;
  const gap = v? v.gab : 0.5;
  let s = mass*(0.55+0.45*gap);
  if(weather && weather.regn) s*=1.15;
  return Math.min(100, Math.round(s));
}
function waitFor(gab){ if(gab>=0.75) return "2–4 min"; if(gab>=0.55) return "3–6 min"; if(gab>=0.4) return "5–8 min"; return "7–12 min"; }
function bumpWait(w,mins){ const m = w.match(/(\d+)–(\d+) min/); return m? (+m[1]+mins)+"–"+(+m[2]+mins)+" min" : w; }
function boostersFor(ev, v, weather){
  const out=[];
  if(weather && weather.regn) out.push(["🌧️","Regn i aften (+15%)"]);
  if(v){ if(v.gab>=0.7) out.push(["🚌","Svag offentlig transport → taxa-kunder"]); else if(v.gab<=0.4) out.push(["🚇","God metro → kun del af publikum"]); }
  const lbl = (TYPE_LABEL_BR[ev.type]||ev.type).split(" ").pop();
  out.push([TYPE_ICON[ev.type]||"📌", lbl+"-publikum"]);
  return out.slice(0,3);
}
function dedupeJS(events){
  const order = {"sæsonkalender":0, "mønster":1, "fck.dk":2, "Live Nation":2, "cruisedig.com":2, "Københavns Kommune":3};
  const merged = new Map();
  events.forEach(ev=>{
    const base = ev.navn.replace(/\s*(SOLARIS|tour|world tour|the wourld tour).*$/i,"");
    const key = normS(base)+"|"+ev.dato;
    const old = merged.get(key);
    if(!old || (order[ev.kilde]??9) < (order[old.kilde]??9)) merged.set(key, ev);
  });
  return [...merged.values()];
}

    if(c && c.dato){ applyLive(c,"cache"); setStatus("⚠️ Kunne ikke hente live — viser gemte data fra "+fmtDate(c.dato), true); return; }
  }catch(e){}
  setStatus("⚠️ Kunne ikke hente live-data — viser demo (tryk ↻ for at prøve igen)", true);
}

/* ============ DINE EGNE EVENTS ============ */
let MY_EVENTS = [];
try{ MY_EVENTS = JSON.parse(LS.getItem("stf_myevents")||"[]"); }catch(e){ MY_EVENTS = []; }
function saveMy(){ try{ LS.setItem("stf_myevents", JSON.stringify(MY_EVENTS)); }catch(e){} }
function myEventObj(m){
  const v = VENUES.find(x=>x.id===m.vid);
  return {id:m.id, vid:m.vid||null, icon:"📌", cat:CATOF[m.type]||"kultur",
    name:wrap(m.navn), venue:wrap(v? v.navn : L.otherPlace), cap:null,
    start:m.start, end:m.slut, window:hhmm2plan(toM(m.slut))+" – "+hhmm2plan(toM(m.slut)+90),
    score:60, curve:"dinner", spot:wrap(v? v.spot : "—"), wait:"—",
    boosters:[{i:"📌",da:"Dit event",en:"Your event"}], spots:[],
    src:"dit event", note:m.note||"", dato:m.dato, my:true,
    lat:v? v.lat:null, lon:v? v.lon:null};
}
function mergeMyEvents(){
  EVENTS = EVENTS.filter(e=>!String(e.id||"").startsWith("my"));
  MY_EVENTS.forEach(m=>EVENTS.push(myEventObj(m)));
}
function openAddForm(){
  const types = ["koncert","sport","festival","kultur","natklub","business"];
  const venueOpts = VENUES.map(v=>`<option value="${esc(v.id)}">${esc(v.navn)}</option>`).join("");
  $("sheetBody").innerHTML = `
    <div class="s-title">＋ ${L.addTitle}</div>
    <div class="frm">
      <label>${L.evName}</label><input id="fName" placeholder="fx Stor koncert på Refshaleøen">
      <label>${L.evVenue}</label><select id="fVenue"><option value="">— ${L.evVenue} —</option>${venueOpts}</select>
      <div class="row2"><div><label>${L.evDate}</label><input id="fDate" type="date"></div>
      <div><label>${L.evType}</label><select id="fType">${types.map(t=>`<option value="${t}">${TYPE_LABEL_BR[t]||t}</option>`).join("")}</select></div></div>
      <div class="row2"><div><label>${L.evStart}</label><input id="fStart" type="time" value="18:00"></div>
      <div><label>${L.evEnd}</label><input id="fEnd" type="time" value="22:00"></div></div>
      <label>${L.evNote}</label><input id="fNote" placeholder="...">
      <button class="btn yellow" id="fSave">${L.evSave}</button>
      <button class="btn" id="fCancel">${L.evCancel}</button>
    </div>`;
  $("fDate").value = addDaysStr(dataToday(), curDay);
  $("fSave").addEventListener("click", saveMyEvent);
  $("fCancel").addEventListener("click", closeSheet);
  $("sheet").classList.add("open"); $("backdrop").classList.add("show");
}
function saveMyEvent(){
  const navn = $("fName").value.trim();
  if(!navn){ toast(L.reqName); return; }
  const vid = $("fVenue").value, type = $("fType").value;
  const dato = $("fDate").value, start = $("fStart").value, slut = $("fEnd").value;
  if(!dato || !start || !slut || start===slut){ toast(L.reqTime); return; } // nat-events (23-02) er tilladt
  const id = "my"+Date.now();
  MY_EVENTS.push({id, navn, vid, dato, start, slut, type, note:$("fNote").value.trim()||""});
  saveMy();
  mergeMyEvents(); renderAll(); closeSheet(); toast(L.evSaved);
}
function deleteMyEvent(id){
  MY_EVENTS = MY_EVENTS.filter(m=>m.id!==id);
  saveMy();
  mergeMyEvents(); renderAll(); closeSheet(); toast(L.evDeleted);
}

/* ============ UGE-OVERSIGT ============ */
function renderWeek(){
  const el = $("daySel"); if(!el) return;
  const base = new Date(dataToday()+"T12:00:00");
  let h = "";
  for(let off=0; off<7; off++){
    const d = addDays(base, off);
    const ds = isoDate(d);
    const scores = EVENTS.filter(e=>e.dato===ds).map(e=>e.score||0);
    const top = scores.length? Math.max(...scores) : null;
    const wl = off===0 ? L.dayToday : L.dayShort[(d.getDay()+6)%7];
    h += `<button class="wcell ${curDay===off?"on":""} ${top!=null&&top>=70?"hot":""}" data-day="${off}">
      <span class="wd">${wl}</span><span class="ws">${top!=null? top : "·"}</span></button>`;
  }
  el.innerHTML = h;
  el.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    curDay = +b.dataset.day; renderWeek(); renderList();
  }));
}

/* ============ LIVE DATA ============ */
const CATOF = {sport:"sport", koncert:"musik", festival:"fest", kultur:"kultur",
               natklub:"natklub", business:"business", cruise:"kultur", fly:"business"};
function distKm(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLon=(b.lon-a.lon)*Math.PI/180;
  const h=Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function durStr(start,end){
  let m = toM(end)-toM(start)+90;
  const h = Math.floor(m/60); m %= 60;
  return h ? `${h} t ${m} m` : `${m} min`;
}
/* earnOf flyttet til plan-sektionen (tager nu event-objekt — type-justeret) */

function buildLive(){
  const d = LIVE;
  EVENTS = d.events.map(e=>({
    id:e.id, vid:e.vid, icon:e.ikon, cat:CATOF[e.type]||"kultur",
    name:wrap(e.navn), venue:wrap(e.venue), cap:fmtCap(e.kapacitet),
    start:e.start, end:e.slut, window:e.vindue, score:e.score, curve:e.kurve,
    spot:wrap(e.spot), wait:e.ventetid,
    lat:e.lat!=null? e.lat:null, lon:e.lon!=null? e.lon:null,
    boosters:(e.boostere||[]).map(b=>({i:b[0], da:b[1], en:b[1]})),
    spots:(e.steder||[]).map(s=>({name:wrap(s.navn), note:wrap(s.note),
      wait:s.ventetid, supply:s.taxier, best:s.best})),
    src:e.kilde, note:e.note||"", dato:e.dato
  }));
  // venues med unikke koordinater (VEGA-hallerne deler adresse → forskyd)
  const used = new Set();
  VENUES = d.venues.map(v=>{
    let lat=v.lat, lon=v.lon;
    while(used.has(lat.toFixed(4)+","+lon.toFixed(4))) lon += 0.0012;
    used.add(lat.toFixed(4)+","+lon.toFixed(4));
    return {id:v.id, lat, lon, sn:v.navn, label:{dx:12, dy:0, an:"start"}};
  });
  // planlægger fra dagens events (hele døgnet: krydstogter, konferencer, aften — score ≥ 25)
  // Sorteret efter LET-OUT (sluttid) — det er dér folk strømmer ud og taxa-kunderne er
  PLAN_BASE = EVENTS.filter(e=>e.dato===LIVE.dato && e.score>=25)
    .sort((a,b)=>toM(a.end)-toM(b.end));
  PLAN_SOURCE = PLAN_BASE.slice(0,5);
  rebuildPlanner();
  // alerts
  ALERTS = [];
  const tonightAll = EVENTS.filter(e=>e.dato===LIVE.dato);
  const top = tonightAll.slice().sort((a,b)=>b.score-a.score)[0];
  if(top) ALERTS.push({ic:"🚕",
    title:wrap(`${tonightAll.length} events i aften — top: ${tr(top.name)} (${top.score})`),
    sub:wrap(tr(top.spot)), time:{da:"live", en:"live"}});
  if(d.vejr && d.vejr.regn) ALERTS.push({ic:"🌧️",
    title:wrap(lang==="da"?"Regn i aften (+15%)":"Rain tonight (+15%)"),
    sub:wrap(lang==="da"?"Højere efterspørgsel — vær tidligt på plads":"Higher demand — arrive early"),
    time:{da:"live", en:"live"}});
  tonightAll.forEach(e=>{
    const endM = toM(e.end)+(toM(e.end)<toM(e.start)?1440:0), n = nowMin();
    if(n>=endM-120 && n<=endM+90) ALERTS.push({ic:e.icon,
      title:wrap(`${tr(e.name)} — ${n<endM ? (lang==="da"?`slutter om ${endM-n} min`:`ends in ${endM-n} min`) : (lang==="da"?"let-out i gang":"let-out now")}`),
      sub:wrap(`${tr(e.spot)} · ${e.window}`), time:{da:"live", en:"live"}});
  });
  ALERTS = ALERTS.slice(0,4);
}

/* ============ UI / INIT ============ */
function liveNoteText(){
  const d = fmtDate(LIVE.dato);
  return lang==="da" ? `LIVE · data fra ${d}` : `LIVE · data from ${d}`;
}
function renderStatic(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.dataset.t;
    if(T[lang][k] !== undefined) el.textContent = T[lang][k];
  });
  $("brandSub").textContent = L.brandSub;
  $("mapSub").textContent = fmtDate(LIVE ? LIVE.dato : todayStr()) + " · " + nowClock();
  $("demoNote").textContent = LIVE ? liveNoteText() : L.demoNote;
  $("daySel").style.display = LIVE ? "flex" : "none";
  $("sortChip").textContent = curSort==="score" ? L.sortScore : L.sortTime;
  $("sortChip").classList.toggle("on", curSort==="time");
  const st = $("stale");
  if(LIVE && LIVE.dato !== todayStr()){
    st.style.display = "block";
    st.textContent = lang==="da"
      ? `⚠️ Rapport fra ${fmtDate(LIVE.dato)} — kør "python3 spotthefare.py" for at opdatere`
      : `⚠️ Report from ${fmtDate(LIVE.dato)} — run "python3 spotthefare.py" to update`;
  } else st.style.display = "none";
}
function renderAll(){
  renderStatic();
  renderList();
  renderUpcoming();
  renderPlanner();
  renderAlerts();
  if(MAP) renderMarkers();
  if(openId) renderSheet();
}
function setLang(l){
  lang = l; L = T[l];
  try{ localStorage.setItem("stf_lang", l); }catch(e){}
  $("langSel").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.l===l));
  renderAll();
}
function init(){
  mergeMyEvents();
  renderAll();
  $("langSel").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.l)));
  setLang(lang);
  $("clock").textContent = nowClock();
  tickClock();
  setInterval(()=>{ tickClock(); if(LIVE) renderList(); }, 30000);
  loadLive();
  $("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    $("tabs").querySelectorAll("button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    ["tonight","map","plan"].forEach(t=>{ $("tab-"+t).style.display = t===b.dataset.tab ? "block" : "none"; });
    if(b.dataset.tab==="map") initMap();
  }));
  $("filters").querySelectorAll(".chip[data-f]").forEach(c=>c.addEventListener("click",()=>{
    $("filters").querySelectorAll(".chip[data-f]").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); curFilter = c.dataset.f; renderList();
  }));
  $("fabAdd").addEventListener("click",openAddForm);
  $("sortChip").addEventListener("click",()=>{
    curSort = curSort==="score" ? "time" : "score";
    const el = $("sortChip");
    el.textContent = curSort==="score" ? L.sortScore : L.sortTime;
    el.classList.toggle("on", curSort==="time");
    renderList();
  });
  $("bellBtn").addEventListener("click",e=>{ e.stopPropagation(); $("alerts").classList.toggle("show"); });
  $("refreshBtn").addEventListener("click",loadLive);
  $("themeBtn").addEventListener("click",()=>{
    setTheme(document.documentElement.dataset.theme==="light" ? "dark" : "light");
  });
  $("posBtn").addEventListener("click",useMyPos);
  setTheme(document.documentElement.dataset.theme==="light" ? "light" : "dark");
  $("lnMetro").addEventListener("click",()=>{
    METRO_ON = !METRO_ON; $("lnMetro").classList.toggle("on", METRO_ON);
    if(MAP && METRO_LAYER){ METRO_ON ? METRO_LAYER.addTo(MAP) : MAP.removeLayer(METRO_LAYER); }
  });
  $("lnTaxi").addEventListener("click",()=>{
    TAXI_ON = !TAXI_ON; $("lnTaxi").classList.toggle("on", TAXI_ON);
    if(MAP && TAXI_LAYER){ TAXI_ON ? TAXI_LAYER.addTo(MAP) : MAP.removeLayer(TAXI_LAYER); }
  });
  $("alertsClose").addEventListener("click",()=>$("alerts").classList.remove("show"));
  document.addEventListener("click",e=>{ if(!e.target.closest("#alerts") && !e.target.closest("#bellBtn")) $("alerts").classList.remove("show"); });
  $("backdrop").addEventListener("click",closeSheet);
}
document.addEventListener("DOMContentLoaded",init);
